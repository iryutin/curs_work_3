{% extends 'base.html' %}
{% block title %}Удалить сообщение{% endblock %}
{% block content %}
<h2>Удаление сообщения</h2>
<p class="mb-3">Вы уверены, что хотите удалить <strong>{{ object.subject }}</strong>?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">🗑️ Удалить</button>
  <a href="{% url 'mailings:message_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
